<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CloudNote - Earn Daily</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f6f9; margin: 0; padding: 0; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .container { background: #fff; padding: 25px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 350px; text-align: center; }
        h2 { color: #333; margin-bottom: 20px; }
        input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        button { background: #28a745; color: white; border: none; padding: 10px; width: 100%; border-radius: 5px; cursor: pointer; font-size: 16px; margin-top: 10px; }
        button:hover { background: #218838; }
        .hidden { display: none; }
        .dashboard-box { background: #e9ecef; padding: 15px; border-radius: 5px; margin: 10px 0; font-size: 18px; font-weight: bold; color: #333; }
    </style>
</head>
<body>

    <div class="container" id="authBox">
        <h2>CloudNote Login</h2>
        <input type="email" id="email" placeholder="Enter your Email / Phone">
        <input type="password" id="password" placeholder="Enter Password">
        <button onclick="loginUser()">Login / Register</button>
    </div>

    <div class="container hidden" id="dashboardBox">
        <h2>CloudNote Dashboard</h2>
        <div class="dashboard-box">Balance: $<span id="balance">30.00</span></div>
        <p>Daily Task Reward: <b>$0.30</b></p>
        <button onclick="completeTask()">Complete Today's Task</button>
        <p style="font-size: 12px; color: gray; margin-top: 15px;">Binance Deposit & Withdraw Manual System</p>
    </div>

    <script>
        let userBalance = 30.00;

        function loginUser() {
            let email = document.getElementById('email').value;
            if(email === "") {
                alert("Please enter your email!");
                return;
            }
            document.getElementById('authBox').classList.add('hidden');
            document.getElementById('dashboardBox').classList.remove('hidden');
        }

        function completeTask() {
            userBalance += 0.30;
            document.getElementById('balance').innerText = userBalance.toFixed(2);
            alert("Task completed successfully! $0.30 added to your balance.");
        }
    </script>

</body>
</html>
