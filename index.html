<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>کلاؤڈ نوٹ - ارننگ پلیٹ فارم</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #f4f7f6;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
        }
        .container {
            width: 100%;
            max-width: 450px;
        }
        .card {
            background: #ffffff;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
        }
        h1, h2 {
            color: #2c3e50;
            margin-bottom: 20px;
            text-align: center;
            font-size: 22px;
        }
        .form-group {
            margin-bottom: 15px;
            text-align: right;
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            color: #555;
            font-size: 14px;
        }
        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
            transition: border-color 0.3s;
        }
        input:focus {
            border-color: #3498db;
        }
        .btn {
            background-color: #2ecc71;
            color: white;
            border: none;
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
            margin-top: 10px;
        }
        .btn:hover {
            background-color: #27ae60;
        }
        .dashboard-view {
            display: none;
        }
        .balance-box {
            background: #f8f9fa;
            border: 1px solid #e9ecef;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 15px;
            text-align: center;
        }
        .balance-title {
            font-size: 13px;
            color: #7f8c8d;
            margin-bottom: 5px;
        }
        .balance-amount {
            font-size: 26px;
            font-weight: bold;
            color: #2c3e50;
        }
        .section-box {
            background: #fff;
            border: 1px solid #e1e8ed;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 12px;
        }
        .section-box h3 {
            font-size: 15px;
            color: #34495e;
            margin-bottom: 8px;
        }
        .copy-row {
            display: flex;
            gap: 8px;
        }
        .copy-row input {
            background: #f1f2f6;
            font-size: 13px;
        }
        .small-btn {
            background: #3498db;
            color: white;
            border: none;
            padding: 0 12px;
            border-radius: 6px;
            font-size: 13px;
            cursor: pointer;
            white-space: nowrap;
        }
        .small-btn:hover {
            background: #2980b9;
        }
        .logout-btn {
            background: #e74c3c;
            margin-top: 15px;
        }
        .logout-btn:hover {
            background: #c0392b;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- لاگ ان / سائن اپ سکرین -->
        <div id="loginSection" class="card">
            <h1>کلاؤڈ نوٹ - لاگ ان</h1>
            <div class="form-group">
                <label>ای میل یا فون نمبر</label>
                <input type="text" id="username" placeholder="اپنی ای میل درج کریں">
            </div>
            <div class="form-group">
                <label>ذاتی پاسورڈ</label>
                <input type="password" id="password" placeholder="اپنا مضبوط پاسورڈ درج کریں">
            </div>
            <button class="btn" onclick="handleLogin()">لاگ ان / اکاؤنٹ بنائیں</button>
        </div>

        <!-- ڈیش بورڈ سکرین -->
        <div id="dashboardSection" class="card dashboard-view">
            <h1>کلاؤڈ نوٹ ڈیش بورڈ</h1>
            
            <!-- بیلنس باکس -->
            <div class="balance-box">
                <div class="balance-title">موجودہ بیلنس</div>
                <div class="balance-amount">$30.00</div>
            </div>

            <!-- ریفرل لنک سیکشن -->
            <div class="section-box">
                <h3>آپ کا ریفرل لنک</h3>
                <div class="copy-row">
                    <input type="text" id="refLink" value="https://clounode.vercel.app/?ref=user123" readonly>
                    <button class="small-btn" onclick="copyRef()">کاپی کریں</button>
                </div>
            </div>

            <!-- انویسٹمنٹ سیکشن -->
            <div class="section-box">
                <h3>بائنانس انویسٹمنٹ ایڈریس (USDT)</h3>
                <div class="copy-row">
                    <input type="text" id="investAddress" value="TTheYourBinanceWalletAddressHere123" readonly>
                    <button class="small-btn" onclick="copyInvest()">ایڈریس کاپی کریں</button>
                </div>
                <p style="font-size: 11px; color: #7f8c8d; margin-top: 5px;">اس ایڈریس پر فنڈز بھیج کر انویسٹمنٹ مکمل کریں۔</p>
            </div>

            <!-- ودড্রال سیکشن -->
            <div class="section-box">
                <h3>ودড্রال (Binance / OKX)</h3>
                <div class="form-group" style="margin-bottom: 8px;">
                    <label style="font-size: 12px;">اپنا والٹ ایڈریس درج کریں</label>
                    <input type="text" id="withdrawAddress" placeholder="Binance یا OKX کا ایڈریس لکھیں">
                </div>
                <button class="btn" style="padding: 8px; font-size: 14px; margin-top: 5px;" onclick="requestWithdraw()">ودড্রال کی درخواست بھیجیں</button>
            </div>

            <button class="btn logout-btn" style="padding: 10px; font-size: 15px;" onclick="handleLogout()">لاگ آؤٹ کریں</button>
        </div>
    </div>

    <script>
        function handleLogin() {
            var user = document.getElementById('username').value;
            var pass = document.getElementById('password').value;
            if(user === "" || pass === "") {
                alert("براہ کرم اپنی ای میل اور پاسورڈ درج کریں!");
                return;
            }
            // لاگ ان ہو کر ڈیش بورڈ دکھائے گا
            document.getElementById('loginSection').style.display = 'none';
            document.getElementById('dashboardSection').style.display = 'block';
        }

        function handleLogout() {
            document.getElementById('dashboardSection').style.display = 'none';
            document.getElementById('loginSection').style.display = 'block';
        }

        function copyRef() {
            var copyText = document.getElementById("refLink");
            navigator.clipboard.writeText(copyText.value);
            alert("ریفرل لنک کاپی ہو گیا!");
        }

        function copyInvest() {
            var copyText = document.getElementById("investAddress");
            navigator.clipboard.writeText(copyText.value);
            alert("بائنانس انویسٹمنٹ ایڈریس کاپی ہو گیا!");
        }

        function requestWithdraw() {
            var wAddr = document.getElementById('withdrawAddress').value;
            if(wAddr === "") {
                alert("براہ کرم اپنا ودড্রال والٹ ایڈریس درج کریں!");
                return;
            }
            alert("آپ کی ودড্রال کی درخواست کامیابی سے جمع ہو گئی ہے!");
        }
    </script>

</body>
</html>
